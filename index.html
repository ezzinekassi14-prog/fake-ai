<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: 'Cairo', sans-serif; 
    background: #0f172a; 
    color: #e2e8f0; 
    height: 100vh; 
    display: flex; 
    justify-content: center;
    align-items: center;
  }
  
  .app-container {
    width: 100%; 
    max-width: 450px; 
    height: 100vh;
    background: #1e293b;
    display: flex; 
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  @media (min-width: 768px) {
    .app-container { height: 85vh; border-radius: 20px; overflow: hidden; border: 1px solid #334155; }
  }

  header { 
    background: linear-gradient(135deg, #6366f1, #8b5cf6); 
    padding: 20px; 
    text-align: center; 
    font-weight: 600; 
    font-size: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }

  header .dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; }

  .chat { 
    flex: 1; 
    padding: 20px; 
    overflow-y: auto; 
    display: flex; 
    flex-direction: column; 
    gap: 15px; 
  }

  /* شكل فقاعات الشات */
  .msg { 
    padding: 12px 18px; 
    border-radius: 20px; 
    max-width: 80%; 
    font-size: 15px; 
    line-height: 1.5;
    animation: fadeIn 0.3s ease;
    word-wrap: break-word;
  }
  
  .user { 
    background: #6366f1; 
    align-self: flex-end; 
    border-bottom-right-radius: 4px; 
  }
  
  .bot { 
    background: #334155; 
    align-self: flex-start; 
    border-bottom-left-radius: 4px; 
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* مؤشر الكتابة */
  .typing {
    display: flex; gap: 5px; padding: 15px;
    background: #334155; border-radius: 20px; border-bottom-left-radius: 4px;
    align-self: flex-start; width: fit-content;
  }
  .typing span { 
    width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; 
    animation: bounce 1.4s infinite ease-in-out; 
  }
  .typing span:nth-child(1) { animation-delay: -0.32s; }
  .typing span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

  footer { 
    padding: 15px; 
    background: #0f172a; 
    display: flex; 
    gap: 10px; 
    border-top: 1px solid #334155;
  }
  
  input { 
    flex: 1; 
    padding: 15px; 
    border-radius: 25px; 
    border: 1px solid #475569; 
    background: #1e293b; 
    color: white; 
    font-family: inherit;
    outline: none; 
    transition: 0.3s;
  }
  
  input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2); }

  button { 
    padding: 0 25px; 
    border-radius: 25px; 
    border: none; 
    background: linear-gradient(135deg, #6366f1, #8b5cf6); 
    color: white; 
    font-weight: bold; 
    font-family: inherit;
    cursor: pointer; 
    transition: 0.3s;
  }
  button:hover { transform: scale(1.05); }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="dot"></div>
    AI Assistant
  </header>
  
  <div class="chat" id="chat">
    <div class="msg bot">مرحباً! أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟</div>
  </div>
  
  <footer>
    <input id="input" placeholder="اكتب رسالتك هنا..." autocomplete="off">
    <button id="send">إرسال</button>
  </footer>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  function addMsg(text, type) {
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing-indicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    
    input.value = '';
    addMsg(text, 'user');
    showTyping();

    // إرسال للباك اند
    await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });

    // انتظار الرد من تيليجرام
    const timer = setInterval(async () => {
      const res = await fetch('/api/reply');
      const data = await res.json();
      if (data.reply) {
        clearInterval(timer);
        hideTyping();
        addMsg(data.reply, 'bot');
      }
    }, 2000);
  }

  // زرار الإرسال
  sendBtn.onclick = sendMessage;

  // زرار Enter في الكيبورد
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      sendMessage();
    }
  });
</script>
</body>
</html>
